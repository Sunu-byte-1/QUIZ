<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>No sleeps' QUIZ</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/png" href="/icons/culture_10053855.png" />
  <meta name="theme-color" content="#0ea5e9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="/icons/culture_10053855.png" />
  <script>
    // Détection précoce du mode offline pour iOS et autres navigateurs
    window.__isOffline = !navigator.onLine;
    window.addEventListener('online', () => {
      window.__isOffline = false;
      window.dispatchEvent(new Event('app-online'));
    });
    window.addEventListener('offline', () => {
      window.__isOffline = true;
      window.dispatchEvent(new Event('app-offline'));
    });
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
